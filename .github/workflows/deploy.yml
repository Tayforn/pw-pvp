name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DEPLOY_HOST: 89.167.1.191
  DEPLOY_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGmnVfNuSncQcJ5y4JFH8BtrxTH1M3PKwZDE+MHMRLj6
  SITE_URL: https://pvp.thunderpw.fun

jobs:
  server:
    name: Deploy to pvp.thunderpw.fun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Типи й тести до білда: golden-тести ляльки (формули = Хелпер), сторож
      # версії ядра й заборона innerHTML мають блокувати деплой, а не лише локальний прогін.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /
          # Публічний anon-ключ (власний Supabase-проєкт pw-pvp) — безпечний у білді.
          VITE_SUPABASE_URL: https://vnlqxqxnslxcisqfhvsg.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_GLrZl0x0jaNFsvLv68ZGgw_OBp_BH_G

      - name: Upload release
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$DEPLOY_HOST $DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          tar -C dist -czf - . | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "deploy@$DEPLOY_HOST" "deploy pvp ${GITHUB_SHA::12}-${GITHUB_RUN_ATTEMPT}"

      - name: Smoke test
        run: |
          expected=$(grep -o '/assets/index-[^"]*\.js' dist/index.html | head -1)
          live=$(curl -fsS "$SITE_URL/" | grep -o '/assets/index-[^"]*\.js' | head -1)
          echo "expected $expected, live $live"
          test "$expected" = "$live"
          curl -fsS -o /dev/null "$SITE_URL$expected"
